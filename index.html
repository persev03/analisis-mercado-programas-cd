<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="Análisis de Mercado Programas CD. Mercado universitario de Ciencia de Datos en Colombia, Universidad EIA." />
  <title>Análisis de Mercado Programas CD · EIA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>body{margin:0;background:#f5f7fa;color:#182e48;font-family:Arial,sans-serif}#loading{max-width:520px;margin:15vh auto;padding:34px}.brand{font-size:48px;letter-spacing:-5px;font-weight:800}.bar{height:3px;background:#dce7ed;overflow:hidden;border-radius:4px;margin:27px 0}.bar:after{content:'';display:block;width:35%;height:100%;background:#087f8c;animation:load 1.5s infinite}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(400%)}}p{font-size:14px;line-height:1.7;color:#64788b}</style>
</head>
<body>
  <div id="root"><div id="loading"><div class="brand">EIA</div><h1>Análisis de Mercado Programas CD</h1><p>Preparando el mapa, los datos auditados y las proyecciones.</p><div class="bar"></div><p>La primera carga descarga el motor de análisis. Las siguientes visitas aprovechan la caché del navegador.</p></div></div>
  <script type="module">
    const root = document.getElementById('root');
    try {
      if (location.protocol === 'file:') {
        throw new Error('Este archivo se abrió con file://. Para ejecutarlo localmente, abre Terminal en la carpeta del proyecto y ejecuta: python3 -m http.server 8765 --directory dist. Luego visita http://localhost:8765. La web Análisis de Mercado Programas CD en GitHub Pages no requiere este paso.');
      }
      const { mount } = await import('https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js');
      const names = ['app.py','analytics.py','.streamlit/config.toml','data/anual.csv','data/semestral.csv','data/registros_snies.csv','data/metadata.json','data/cronologia.json','data/conciliacion.csv','data/proyecciones.csv','assets/colombia.geojson','data/benchmark_ciencia_datos_v3_completo.xlsx','downloads/informe_ejecutivo_eia.pdf','downloads/analisis_auditado_eia.xlsx'];
      const files=Object.fromEntries(await Promise.all(names.map(async name=>{
        const response=await fetch(new URL(name,location.href),{credentials:'same-origin',cache:'no-store'});
        if(!response.ok)throw new Error('No se pudo cargar '+name+' ('+response.status+')');
        return [name,/\.(pdf|xlsx)$/.test(name)?new Uint8Array(await response.arrayBuffer()):await response.text()];
      })));
      mount({entrypoint:'app.py',files,requirements:['numpy','pandas','plotly'],streamlitConfig:{'client.toolbarMode':'viewer','theme.base':'light','theme.primaryColor':'#087F8C','theme.backgroundColor':'#F5F7FA','theme.secondaryBackgroundColor':'#FFFFFF','theme.textColor':'#182B44','browser.gatherUsageStats':false}},root);
    } catch(error) {
      root.innerHTML='<div id="loading"><div class="brand">EIA</div><h1>No fue posible iniciar Análisis de Mercado Programas CD</h1><p id="error"></p><button onclick="location.reload()">Reintentar</button></div>';
      document.getElementById('error').textContent=error.message;
    }
  </script>
</body>
</html>
